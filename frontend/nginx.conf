# CertiGuard frontend: static SPA + same-origin API reverse proxy.
# Runs as the non-root "nginx" user (nginxinc/nginx-unprivileged image).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The backend caps uploads at MAX_UPLOAD_SIZE_MB (10 MB by default). Leave
    # room for multipart framing so the API, not Nginx, returns the error.
    client_max_body_size 12m;

    # Hashed Vite build output is immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA entry point must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Same-origin API. proxy_pass has NO trailing slash and uses $request_uri,
    # so the /api prefix and query string are forwarded unchanged to FastAPI.
    # Docker's embedded DNS re-resolves the service name, so a recreated
    # backend container does not leave Nginx pointing at a stale IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # OCR and model inference can exceed the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback. Current routes are hash-based, so this is defensive.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
